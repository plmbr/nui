name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm install

      - name: Validate VERSION matches release tag
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$file_version" != "$version" ]; then
            echo "VERSION file ($file_version) does not match release tag ($tag)" >&2
            exit 1
          fi

      - name: Build release archives
        run: ./scripts/build-release.sh "${{ github.event.release.tag_name }}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/nui_${{ github.event.release.tag_name }}_linux_amd64.tar.gz
            dist/nui_${{ github.event.release.tag_name }}_linux_arm64.tar.gz
            dist/nui_${{ github.event.release.tag_name }}_darwin_amd64.tar.gz
            dist/nui_${{ github.event.release.tag_name }}_darwin_arm64.tar.gz
            dist/nui_${{ github.event.release.tag_name }}_windows_amd64.zip
            dist/nui_${{ github.event.release.tag_name }}_windows_arm64.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    name: Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: darwin-arm64
            runner: macos-latest
            platform: darwin/arm64
            os_name: darwin
            arch: arm64
            tags: ""
          - label: darwin-amd64
            runner: macos-13
            platform: darwin/amd64
            os_name: darwin
            arch: amd64
            tags: ""
          - label: windows-amd64
            runner: windows-latest
            platform: windows/amd64
            os_name: windows
            arch: amd64
            tags: ""
          - label: linux-amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            os_name: linux
            arch: amd64
            tags: webkit2_41
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            os_name: linux
            arch: arm64
            tags: webkit2_41
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm install

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Build desktop
        env:
          CGO_ENABLED: "1"
        run: |
          args=(--skip-ui --platform "${{ matrix.platform }}")
          if [ -n "${{ matrix.tags }}" ]; then
            args+=(--tags "${{ matrix.tags }}")
          fi
          ./scripts/build-desktop.sh "${args[@]}"

      - name: Package desktop archive
        run: |
          ./scripts/package-desktop.sh \
            "${{ github.event.release.tag_name }}" \
            "${{ matrix.os_name }}" \
            "${{ matrix.arch }}"

      - name: Upload desktop release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/nui-desktop_${{ github.event.release.tag_name }}_${{ matrix.os_name }}_${{ matrix.arch }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
