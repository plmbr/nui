name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-cli:
    name: CLI (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cross-compile linux/windows on Linux. Darwin must be built on macOS
          # so codesign produces a signature current macOS accepts.
          - label: linux-windows
            runner: ubuntu-latest
            targets: "linux/amd64 linux/arm64 windows/amd64 windows/arm64"
          - label: darwin-arm64
            runner: macos-latest
            targets: "darwin/arm64"
          - label: darwin-amd64
            runner: macos-15-intel
            targets: "darwin/amd64"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Validate VERSION matches release tag
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$file_version" != "$version" ]; then
            echo "VERSION file ($file_version) does not match release tag ($tag)" >&2
            exit 1
          fi

      - name: Build release archives
        env:
          NUI_RELEASE_TARGETS: ${{ matrix.targets }}
        run: ./scripts/build-release.sh "${{ github.event.release.tag_name }}"

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.label }}
          path: |
            dist/nui_${{ github.event.release.tag_name }}_*.tar.gz
            dist/nui_${{ github.event.release.tag_name }}_*.zip
          if-no-files-found: error

  publish-cli:
    name: Publish CLI release assets
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=(nui_*.tar.gz nui_*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "error: no CLI archives downloaded" >&2
            exit 1
          fi
          sha256sum "${files[@]}" | sort -k2 >checksums.txt
          ls -la
          cat checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/nui_${{ github.event.release.tag_name }}_linux_amd64.tar.gz
            dist/nui_${{ github.event.release.tag_name }}_linux_arm64.tar.gz
            dist/nui_${{ github.event.release.tag_name }}_darwin_amd64.tar.gz
            dist/nui_${{ github.event.release.tag_name }}_darwin_arm64.tar.gz
            dist/nui_${{ github.event.release.tag_name }}_windows_amd64.zip
            dist/nui_${{ github.event.release.tag_name }}_windows_arm64.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    name: Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: darwin-arm64
            runner: macos-latest
            platform: darwin/arm64
            os_name: darwin
            arch: arm64
            tags: ""
          - label: darwin-amd64
            runner: macos-15-intel
            platform: darwin/amd64
            os_name: darwin
            arch: amd64
            tags: ""
          - label: windows-amd64
            runner: windows-latest
            platform: windows/amd64
            os_name: windows
            arch: amd64
            tags: ""
          - label: linux-amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            os_name: linux
            arch: amd64
            tags: webkit2_41
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            os_name: linux
            arch: arm64
            tags: webkit2_41
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Build desktop
        env:
          CGO_ENABLED: "1"
        run: |
          args=(--skip-ui --platform "${{ matrix.platform }}")
          if [ -n "${{ matrix.tags }}" ]; then
            args+=(--tags "${{ matrix.tags }}")
          fi
          ./scripts/build-desktop.sh "${args[@]}"

      - name: Package desktop archive
        run: |
          ./scripts/package-desktop.sh \
            "${{ github.event.release.tag_name }}" \
            "${{ matrix.os_name }}" \
            "${{ matrix.arch }}"

      - name: Upload desktop release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/nui-desktop_${{ github.event.release.tag_name }}_${{ matrix.os_name }}_${{ matrix.arch }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: Refresh checksums.txt (CLI + desktop)
    needs: [publish-cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cd dist
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --pattern 'nui_*' \
            --pattern 'nui-desktop_*' \
            --clobber
          shopt -s nullglob
          files=(nui_*.tar.gz nui_*.zip nui-desktop_*.zip nui-desktop_*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "error: no release archives downloaded" >&2
            exit 1
          fi
          sha256sum "${files[@]}" | sort -k2 >checksums.txt
          cat checksums.txt

      - name: Upload checksums.txt
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
