agents:
  - id: echo-bot
    name: Echo Bot
    description: Uses the extension echo harness
    harness:
      type: ext:corp-pack/echo
  - id: reviewer
    name: Code Reviewer
    description: Claude with corp extension skills, catalog MCP, and corp-tools
    harness:
      type: claude-code
      model: claude-sonnet-4-6
    aiAssets:
      skills:
        - name: code-review
          ref: ext:corp-pack/code-review
      mcpServers:
        - name: echo-tool
          ref: ext:corp-pack/echo-tool
        - name: corp-tools
          ref: ext:corp-pack/corp-tools
      rules:
        - name: corp-guidelines
          ref: ext:corp-pack/corp-guidelines
