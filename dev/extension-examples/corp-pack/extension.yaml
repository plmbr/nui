apiVersion: loop.dev/extension/v1
name: corp-pack
version: 1.0.0
displayName: Corp Pack
description: Example extension with harnesses, MCP servers, skills, and agents

contributions:
  aiAssets:
    mcpServers:
      - name: corp-tools
        install: true
        tools:
          - name: echo
            description: Echo a message back
            command: ["python3", "${LOOP_EXTENSION_DIR}/tools/echo.py"]
            inputSchema:
              type: object
              properties:
                message:
                  type: string
                  description: Text to echo
              required: [message]
          - name: reverse
            description: Reverse a message
            command: ["python3", "${LOOP_EXTENSION_DIR}/tools/reverse.py"]
            inputSchema:
              type: object
              properties:
                message:
                  type: string
                  description: Text to reverse
              required: [message]
    skills:
      - name: deploy-checklist
        install: true
        content: |
          ---
          name: deploy-checklist
          description: Pre-deploy verification steps
          ---
          Run through the checklist before merging.
    instructions:
      - name: corp-guidelines
        install: true
        content: |
          Follow corporate security guidelines. Never commit secrets.

  catalog:
    mcpServers:
      source:
        file: mcp-servers.json
    skills:
      source:
        file: skills.yaml

  harnesses:
    source:
      file: harnesses.yaml
    runtime:
      transport: stdio
      command: ["python3", "harness_host.py"]

  agents:
    source:
      file: agents.yaml

  mentionProviders:
    source:
      file: mention-providers.yaml
    runtime:
      transport: stdio
      command: ["python3", "mention_host.py"]
