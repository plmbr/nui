adl: "1.0"

# The simplest possible agent. Single step, no dependencies, no aiAssets.
# Uses the default claude-code harness inherited from the top-level harness block.

id: hello-world
name: Hello World
description: Echoes the user's message back with a greeting.
version: 0.1.0

env:
  ANTHROPIC_BASE_URL: https://api.anthropic.com

harness:
  type: claude-code
  model: claude-haiku-4-5-20251001
  env:
    ANTHROPIC_API_KEY: your-api-key

systemPrompt: |
  You are a friendly greeter. Respond warmly to whatever the user says.
  Keep responses short — one or two sentences.

steps:
  - name: greet
