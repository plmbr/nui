adl: "1.0"
id: software-team-orchestrator
name: Software Team Orchestrator
description: Adaptive chair that picks one sub-agent at a time until the goal is done.
version: 0.1.0

harness:
  type: claude-code

orchestration:
  type: subAgents
  members:
    - agent: claude-code
    - agent: codex
  sessionMode: persistent
  memberTimeout: 8m
  maxTurns: 20

systemPrompt: >-
  You are an adaptive orchestrator. Pick exactly one sub-agent at a time via
  run_sub_agent (never fan out to all). After each result, finish with the final
  answer or delegate again to the same or a different agent.
