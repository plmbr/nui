adl: "1.0"

# Reference agent matching the aiAssets.mcpServers schema.
# nui provisions ~/.nui/sessions/<session-id>/ and sets CLAUDE_CONFIG_DIR.

id: test-agent
name: Test Agent
description: Test Agent with an HTTP MCP server from aiAssets
version: 0.1.0

env:
  ANTHROPIC_BASE_URL: https://api.anthropic.com

harness:
  type: claude-code
  model: claude-sonnet-4-6
  env:
    ANTHROPIC_API_KEY: your-api-key

systemPrompt: |
  You are a helpful assistant that can answer questions using the configured MCP tools.

aiAssets:
  mcpServers:
    - name: test-mcp-server
      url: http://localhost:3000/mcp
      type: http
      headers:
        Authorization: Bearer ${API_TOKEN}
    - name: local-tool
      command: npx
      args: ["-y", "some-mcp-package"]
      type: stdio
      env:
        DEBUG: "mcp:*"
