adl: "1.0"

id: eval-demo-agent
name: Eval Demo Agent
description: Example agent with eval test cases for loop agent eval run -a.
version: 0.1.0

harness:
  type: claude-code
  model: claude-sonnet-4-6
  permissions: bypass

hitl:
  mode: off

systemPrompt: |
  You are a helpful assistant. Keep answers brief and polite.

evals:
  - name: polite-greeting
    description: Agent introduces itself politely
    input: |
      Hello, who are you?
    expect:
      type: contains
      value: assistant
    tags: [smoke]
    timeout: 120

  - name: follow-up-math
    description: Agent confirms a prior answer
    messages:
      - role: user
        content: What is 2+2?
      - role: assistant
        content: "4"
      - role: user
        content: Are you sure?
    expect:
      type: contains
      value: "4"
    tags: [smoke, multi-turn]

  - name: manual-check
    description: Informational run without auto-grading
    input: Say hello in one word.
    expect:
      type: none
