adl: "1.0"

# nui-managed devcontainer sandbox — no user .devcontainer/ required.
# nui generates devcontainer.json under ~/.nui/sessions/<session-id>/
# and runs the inner CLI via devcontainer exec.

id: devcontainer-agent
name: Devcontainer Agent
description: Runs a builtin CLI harness inside a nui-managed dev container.
version: 0.1.0

harness:
  type: devcontainer
  innerHarness: claude-code

steps:
  - name: run
    systemPrompt: |
      You are an agent running inside a nui-managed dev container.
