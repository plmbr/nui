adl: "1.0"

# Two-step sequential pipeline: research then write.
# The write step receives the research output as its input context.
# Demonstrates: dependsOn, named outputs, per-step systemPrompt override.

name: research-and-write
description: Researches a topic then writes a polished summary.
version: 0.1.0

harness:
  type: claude-code
  model: claude-sonnet-4-6

constraints:
  maxTokens: 50000
  timeout: 10m

steps:
  - name: research
    policy: react
    systemPrompt: |
      You are a research assistant. Given a topic, gather key facts,
      identify the most important points, and produce a structured
      bullet-point research brief. Do not write prose — bullets only.
    outputs:
      - name: brief
        type: text

  - name: write
    policy: react
    dependsOn: [research]
    inputs:
      - from: research.brief
    systemPrompt: |
      You are a technical writer. You will receive a research brief.
      Transform it into a clear, engaging 3-paragraph summary suitable
      for a general audience. Use the research brief as your only source.
    outputs:
      - name: article
        type: text
