adl: "1.0"

# Agent skills declared under aiAssets.skills.
# nui resolves each skill and copies the full directory into the session harness config.

id: skills-demo-agent
name: Skills Demo Agent
description: Demonstrates local, ref, and inline skills from aiAssets
version: 0.1.0

harness:
  type: claude-code
  model: claude-sonnet-4-6

systemPrompt: |
  You are a helpful assistant. Use installed skills when they apply.

aiAssets:
  skills:
    # Local path (directory containing SKILL.md)
    - name: code-review
      path: ./skills/code-review

    # Catalog reference (~/.nui/skills/<ref>/skill/)
    - name: commit-helper
      ref: commit-helper

    # Inline SKILL.md content
    - name: greeting
      content: |
        ---
        name: greeting
        description: Responds with a brief friendly greeting
        ---
        Keep greetings to one short sentence.

    # Git repository (path is relative to repo root)
    # - name: shared-style
    #   git: https://github.com/example/agent-skills.git
    #   path: skills/shared-style
    #   version: v1.0.0
