adl: "1.0"

# Agent that iterates — critiques its own output, revises, and loops until
# it judges the result good enough (or hits the maxIterations cap).
#
# Execution graph (cyclic):
#
#   draft → critique → [done?] ──yes──→ finalize
#               ↑
#               └──no── revise ────────┘
#
# Demonstrates: loop policy, self-improvement pattern, iteration cap.

id: iterative-writer
name: Iterative Writer
description: Drafts, self-critiques, and revises until quality threshold is met.
version: 0.1.0

harness:
  type: claude-code
  model: claude-sonnet-4-6

constraints:
  maxTokens: 80000
  timeout: 20m

steps:
  - name: draft
    policy: react
    systemPrompt: |
      You are a writer. Produce a first draft of whatever the user requests.
      Output only the draft text.
    outputs:
      - name: text
        type: text

  - name: critique-and-revise
    policy: loop
    maxIterations: 3
    dependsOn: [draft]
    inputs:
      - from: draft.text
        as: currentDraft
    systemPrompt: |
      You are a writing critic and editor working in a revision loop.

      You will receive the current draft. Evaluate it on three criteria:
        1. Clarity — is it easy to understand?
        2. Conciseness — is it free of redundancy?
        3. Impact — does the opening hook the reader?

      If all three criteria score 8/10 or above, output:
        DONE
        <final revised text>

      Otherwise, output:
        REVISE
        <fully revised draft addressing the weakest criterion>

      The loop runner reads DONE or REVISE from the first line and either
      exits the loop or feeds the revised draft back as the next input.
    outputs:
      - name: result
        type: text

  - name: finalize
    policy: react
    dependsOn: [critique-and-revise]
    inputs:
      - from: critique-and-revise.result
    systemPrompt: |
      Format the final approved draft with a title and word count.
      Output: "Final draft (<N> words):\n\n<text>"
