adl: "1.0"

# Full-featured complex example combining: multi-source fan-out, multi-harness,
# aiAssets.mcpServers, adversarial verification, and section generation.
#
# Execution graph:
#
#   ┌─ web-search (remote, search API) ─────────┐
#   ├─ code-search (docker, code index)  ───────┤
#   └─ doc-search (claude-code + MCP)  ─────────┤
#                                               ↓
#                                         consolidate (claude-code, opus)
#                                               ↓
#                                    ┌─ verify-claim-A ─┐
#                                    ├─ verify-claim-B ─┤
#                                    └─ verify-claim-C ─┘
#                                               ↓
#                                          adjudicate
#                                               ↓
#                                    generate-sections
#                                               ↓
#                                          compile-report

id: deep-research-report
name: Deep Research Report
description: |
  Multi-source research with adversarial fact-checking and section generation.
  Produces a cited technical report.
version: 0.2.0

harness:
  type: claude-code
  model: claude-sonnet-4-6

steps:
  # ── Phase 1: search across three sources ─────────────────────────────────

  - name: web-search
    harness:
      type: remote
      host: search-api.internal
      port: 9090
    systemPrompt: |
      Search the web for the user's research topic. Collect the top 10
      most relevant results. For each: title, URL, one-sentence summary,
      and a credibility score (1–5). Output as JSON array.
    outputs:
      - name: results
        type: json

  - name: code-search
    harness:
      type: docker
      image: nui-code-index:latest
      containerPort: 9090
    systemPrompt: |
      Search the internal code index for implementations, tests, or
      configuration related to the user's topic. Return relevant
      file paths, function names, and short excerpts.
    outputs:
      - name: codeRefs
        type: json

  - name: doc-search
    harness:
      type: claude-code
      model: claude-haiku-4-5-20251001    # cheap model, just retrieval
    aiAssets:
      mcpServers:
        - name: internal-docs
          url: http://localhost:3040
          type: http
    systemPrompt: |
      Search internal documentation (wiki, runbooks, RFCs) for content
      related to the user's topic. Return page titles, URLs, and excerpts.
    outputs:
      - name: docRefs
        type: json

  # ── Phase 2: consolidate all sources, extract claims ──────────────────────

  - name: consolidate
    harness:
      type: claude-code
      model: claude-opus-4-8    # best model for synthesis
    dependsOn:
      - web-search
      - code-search
      - doc-search
    inputs:
      - from: web-search.results
        as: webResults
      - from: code-search.codeRefs
        as: codeRefs
      - from: doc-search.docRefs
        as: docRefs
    systemPrompt: |
      You have received results from three search sources: web, code index,
      and internal docs. Perform the following:

      1. Deduplicate overlapping results across sources.
      2. Extract the 5 most important factual claims that need verification.
      3. Identify the 4–6 logical sections for the final report.

      Output JSON with two keys:
        "claims": [{"id": "A", "text": "..."}, ...]   (exactly 3 claims)
        "sections": [{"id": 1, "title": "...", "focus": "..."}, ...]
    outputs:
      - name: claims
        type: json
      - name: sections
        type: json

  # ── Phase 3: adversarial verification of top claims ────────────────────────

  - name: verify-claim-A
    dependsOn: [consolidate]
    inputs:
      - from: consolidate.claims
        filter: "id == 'A'"
    systemPrompt: |
      You are an adversarial fact-checker. Your job is to REFUTE the claim
      you receive. Actively search for counter-evidence, exceptions, and
      nuance. Be skeptical. Output:
        CONFIRMED or REFUTED
        <one paragraph of evidence>
    outputs:
      - name: verdict
        type: text

  - name: verify-claim-B
    dependsOn: [consolidate]
    inputs:
      - from: consolidate.claims
        filter: "id == 'B'"
    systemPrompt: |
      You are an adversarial fact-checker. Attempt to REFUTE the claim.
      Output: CONFIRMED or REFUTED, then one paragraph of evidence.
    outputs:
      - name: verdict
        type: text

  - name: verify-claim-C
    dependsOn: [consolidate]
    inputs:
      - from: consolidate.claims
        filter: "id == 'C'"
    systemPrompt: |
      You are an adversarial fact-checker. Attempt to REFUTE the claim.
      Output: CONFIRMED or REFUTED, then one paragraph of evidence.
    outputs:
      - name: verdict
        type: text

  # ── Phase 4: adjudicate verification results ──────────────────────────────

  - name: adjudicate
    harness:
      type: claude-code
      model: claude-opus-4-8
    dependsOn:
      - verify-claim-A
      - verify-claim-B
      - verify-claim-C
      - consolidate
    inputs:
      - from: verify-claim-A.verdict
        as: verdictA
      - from: verify-claim-B.verdict
        as: verdictB
      - from: verify-claim-C.verdict
        as: verdictC
      - from: consolidate.claims
        as: originalClaims
      - from: consolidate.sections
        as: sections
    systemPrompt: |
      Review the adversarial verification verdicts for all claims.
      Produce a research quality assessment:
        - Which claims are confirmed/refuted
        - Confidence level for the overall research (high/medium/low)
        - Any gaps that would prevent writing a reliable report
        - The final approved section list (may trim if gaps are found)
      Output JSON: {"confidence": "...", "confirmedClaims": [...],
                    "refutedClaims": [...], "approvedSections": [...],
                    "gaps": [...]}
    outputs:
      - name: assessment
        type: json

  # ── Phase 5: generate report sections ─────────────────────────────────────

  - name: generate-sections
    harness:
      type: claude-code
      model: claude-sonnet-4-6
    dependsOn: [adjudicate, consolidate]
    inputs:
      - from: adjudicate.assessment
        as: assessment
      - from: web-search.results
        as: webSources
      - from: doc-search.docRefs
        as: docSources
    systemPrompt: |
      Write one section of the research report. You will receive:
        - The section title and focus
        - Verified claims relevant to this section
        - Source material from web and docs

      Write 3–5 paragraphs with inline citations [Source N].
      Be precise and cite every factual claim.
    outputs:
      - name: content
        type: text

  # ── Phase 6: compile final report ─────────────────────────────────────────

  - name: compile-report
    harness:
      type: claude-code
      model: claude-opus-4-8
    dependsOn: [generate-sections, adjudicate]
    inputs:
      - from: generate-sections.content
        as: sections
      - from: adjudicate.assessment
        as: assessment
    systemPrompt: |
      Assemble the final research report from the individual sections.
      Add:
        1. Executive summary (3–4 sentences)
        2. Numbered reference list from all cited sources
        3. Research confidence statement at the end

      Format as clean Markdown with a title, ToC, and section headers.
    outputs:
      - name: report
        type: text
