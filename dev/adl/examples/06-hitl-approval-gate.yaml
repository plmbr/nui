adl: "1.0"

# Pipeline that pauses for human approval before taking an irreversible action.
#
# Execution graph:
#
#   draft → [approval gate] → publish
#
# The orchestrator suspends after draft, emits a needs_approval event to the
# UI, and blocks. The user approves or rejects via the chat UI. On approval,
# the publish step runs. On rejection, the run ends without publishing.
#
# Demonstrates: approval gate, approvalTimeout, per-step aiAssets.mcpServers.

name: draft-and-publish
description: Drafts content for human review, then publishes only if approved.
version: 0.1.0

harness:
  type: claude-code
  model: claude-sonnet-4-6

constraints:
  maxTokens: 30000
  timeout: 60m    # long timeout to allow time for human review

steps:
  - name: draft
    policy: react
    systemPrompt: |
      You are a content writer. Write a polished blog post based on the
      user's topic. Include a title, introduction, 3 body sections, and
      a conclusion. Output only the post content — no commentary.
    outputs:
      - name: content
        type: text

  - name: review
    policy: react
    dependsOn: [draft]
    inputs:
      - from: draft.content
    approval: required
    approvalTimeout: 30m    # deny on timeout — publish is irreversible
    systemPrompt: |
      Present the drafted content to the human reviewer and ask:
      "Does this look good to publish? Reply APPROVE or REJECT with optional feedback."

  - name: publish
    policy: react
    dependsOn: [review]
    inputs:
      - from: draft.content
      - from: review.approvalDecision
    systemPrompt: |
      The content has been approved. Simulate publishing it by printing:
      "Published: <title>" followed by a confirmation timestamp.
    aiAssets:
      mcpServers:
        - name: cms-publisher
          url: http://localhost:3010
          type: http
