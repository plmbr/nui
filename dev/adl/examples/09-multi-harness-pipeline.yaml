adl: "1.0"

# Each step runs on a different harness and model.
# Demonstrates that Loop resolves the harness per-step and routes accordingly.
#
# Execution graph:
#
#   plan (claude-code, opus)
#     → execute (docker, sandboxed runner)
#     → security-scan (codex, local)   ← parallel with review
#     → review (claude-code, sonnet)
#     → [approval gate]
#     → deploy (remote, CI server)
#
# Real-world analogy: AI pair programmer — plans in Claude, executes in a
# sandbox, security-scans with Codex, reviews the output, gets human sign-off,
# then triggers a remote CI deploy.

id: ai-dev-pipeline
name: AI Dev Pipeline
description: Plan → sandbox execute → security-scan + review → approve → remote deploy.
version: 0.1.0

# Top-level harness is the default for steps that don't override it.
env:
  ANTHROPIC_BASE_URL: https://api.anthropic.com

harness:
  type: claude-code
  model: claude-sonnet-4-6
  env:
    ANTHROPIC_API_KEY: your-api-key

constraints:
  maxTokens: 150000
  timeout: 45m

steps:
  - name: plan
    policy: react
    harness:
      type: claude-code
      model: claude-opus-4-8    # best model for planning
    systemPrompt: |
      You are a senior software engineer. The user will describe a feature or bug fix.
      Produce a step-by-step implementation plan:
        1. Files to create or modify
        2. Exact code changes (show diffs)
        3. Test commands to verify the change
      Be precise — a code runner will execute your instructions literally.
    outputs:
      - name: plan
        type: text

  - name: execute
    policy: react
    harness:
      type: docker
      image: loop-dev-sandbox:latest    # pre-built image with the project code
      containerPort: 9090
    dependsOn: [plan]
    inputs:
      - from: plan.plan
    systemPrompt: |
      Apply the implementation plan to the codebase in this sandbox.
      Run the test commands from the plan and report results.
      Output: pass/fail per test, stdout, and any errors.
    outputs:
      - name: testResults
        type: text

  - name: security-scan
    policy: react
    harness:
      type: codex
      model: claude-sonnet-4-6    # codex auto-detects model from env; explicit override here
    dependsOn: [execute]
    inputs:
      - from: execute.testResults
    systemPrompt: |
      Review the code changes and test output for security issues.
      Look for: injection vulnerabilities, hardcoded secrets, unsafe deserialization,
      overly permissive file/network access, and dependency risks.
      Output: CLEAN or RISKS FOUND, with specific findings and line numbers if applicable.
    outputs:
      - name: securityReport
        type: text

  - name: review
    policy: react
    harness:
      type: claude-code
      model: claude-sonnet-4-6
    dependsOn: [plan, execute, security-scan]
    inputs:
      - from: plan.plan
        as: implementationPlan
      - from: execute.testResults
        as: testResults
      - from: security-scan.securityReport
        as: securityReport
    systemPrompt: |
      Review the implementation plan, test results, and security report.
      Assess: Did all tests pass? Are there any security concerns? Is the change ready?
      Output a short review: PASS or FAIL, with a one-paragraph justification.
    outputs:
      - name: verdict
        type: text

  - name: human-signoff
    policy: react
    dependsOn: [review]
    inputs:
      - from: review.verdict
    approval: required
    approvalTimeout: 60m
    systemPrompt: |
      Present the automated review verdict to the human.
      Ask: "The automated review says <verdict>. Approve deployment? APPROVE or REJECT."

  - name: deploy
    policy: react
    harness:
      type: remote
      host: ci.internal
      port: 9090    # CI server running the Loop HTTP/SSE extension protocol
    dependsOn: [human-signoff]
    inputs:
      - from: human-signoff.approvalDecision
      - from: execute.testResults
    systemPrompt: |
      Trigger a deployment using the test-validated build artifact.
      Report the deployment job URL and status.
    aiAssets:
      mcpServers:
        - name: ci-runner
          url: http://ci.internal:3020
          type: http
