adl: "1.0"

# Demonstrates the three sandbox variants for the codex harness:
#   - none (default): runs `codex` directly on the host
#   - bubblewrap: wraps the subprocess with bwrap (Linux only)
#   - docker: runs inside a Loop-managed Docker container
#
# All three variants produce the same outputs — the sandbox field only
# affects isolation, not the agent's capabilities or API.
#
# Execution graph:
#
#   analyse-local (codex, none)
#     → analyse-sandboxed (codex, bubblewrap)   ← parallel
#     → analyse-docker (codex, docker)           ← parallel
#     → compare (claude-code, sonnet)
#
# Use case: validate that a security-sensitive analysis produces the same
# findings regardless of sandbox level before adopting stricter isolation.

id: codex-sandbox-comparison
name: Codex Sandbox Comparison
description: Run the same codex prompt under three sandbox levels and compare outputs.
version: 0.1.0

harness:
  type: claude-code
  model: claude-sonnet-4-6

constraints:
  maxTokens: 80000
  timeout: 15m

steps:
  - name: analyse-local
    policy: react
    harness:
      type: codex
      sandbox: none               # run directly on the host (default)
    systemPrompt: |
      Analyse the repository for potential security vulnerabilities.
      Focus on: hardcoded secrets, unsafe deserialization, and injection vectors.
      Be concise — bullet points with file:line references.
    outputs:
      - name: findings
        type: text

  - name: analyse-sandboxed
    policy: react
    harness:
      type: codex
      sandbox: bubblewrap         # Linux only; bwrap wraps the subprocess
    systemPrompt: |
      Analyse the repository for potential security vulnerabilities.
      Focus on: hardcoded secrets, unsafe deserialization, and injection vectors.
      Be concise — bullet points with file:line references.
    outputs:
      - name: findings
        type: text

  - name: analyse-docker
    policy: react
    harness:
      type: codex
      sandbox: docker
      image: loop-codex:latest    # build with: docker build -f docker/codex/Dockerfile -t loop-codex:latest docker/
    systemPrompt: |
      Analyse the repository for potential security vulnerabilities.
      Focus on: hardcoded secrets, unsafe deserialization, and injection vectors.
      Be concise — bullet points with file:line references.
    outputs:
      - name: findings
        type: text

  - name: compare
    policy: react
    harness:
      type: claude-code
      model: claude-sonnet-4-6
    dependsOn: [analyse-local, analyse-sandboxed, analyse-docker]
    inputs:
      - from: analyse-local.findings
        as: localFindings
      - from: analyse-sandboxed.findings
        as: bubblewrapFindings
      - from: analyse-docker.findings
        as: dockerFindings
    systemPrompt: |
      Compare the three security analysis runs (local, bubblewrap, docker sandbox).
      Highlight any differences — findings present in one run but absent in another
      may indicate sandbox escape or filesystem access differences.
      Output: summary of agreement level and any discrepancies.
    outputs:
      - name: comparisonReport
        type: text
