[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nui-extension"
version = "0.1.0"
description = "nui programmatic extension SDK"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
nui-ext = "nui_extension.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nui_extension*"]

[tool.nui]
id = "example-ext"
displayName = "Example Extension"
